name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 bundles npm 10.9.x, whose lockfile resolver mis-generates this
      # project's tree (npm install writes a package-lock.json that npm ci then
      # rejects). npm 12 fixes it; pin it so CI matches the committed lock.
      - run: npm install -g npm@12

      - run: npm ci

      # models.ts once re-exported types schema.ts never exported, and nothing
      # caught it: vitest and Vite erase types without checking. This gate stops
      # the type foundation rotting again.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate static site
        # Base path (/3Jongi/) is applied via the $production override in nuxt.config.ts.
        run: npm run generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
