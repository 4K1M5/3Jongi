<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Jongi</title>
<style>
  :root { --paper:#F1F3EE; --ink:#1E2320; --ink-soft:#55605A; --jade:#2E6B5C; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#12160F; --ink:#E7EAE1; --ink-soft:#9DA89E; --jade:#78B9A4; }
  }
  :root[data-theme="dark"] { --paper:#12160F; --ink:#E7EAE1; --ink-soft:#9DA89E; --jade:#78B9A4; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    background:var(--paper); color:var(--ink); padding:2rem;
    font-family: system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .logo { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:clamp(2.5rem,9vw,4.5rem); font-weight:600; letter-spacing:-.02em; margin:0; }
  .logo b { color:var(--jade); }
  .sub { color:var(--ink-soft); font-size:1.05rem; max-width:34ch; margin:.6rem auto 0; line-height:1.5; }
  .tag { margin-top:1.6rem; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--jade); }
</style>
</head>
<body>
  <main>
    <h1 class="logo">3<b>Jongi</b></h1>
    <p class="sub">A per-unit quiz companion for King Sejong Institute Korean.</p>
    <p class="tag">Coming soon</p>
  </main>
</body>
</html>
